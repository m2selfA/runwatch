[workspace]
resolver = "2"
members = [
    "crates/runwatch-core",
    "crates/runwatch-ssh",
    "crates/runwatch-cli",
    "crates/runwatch-gui",
    "crates/runwatch-engine",
    "crates/runwatch-mcp",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
directories = "6"
thiserror = "2"
fs2 = "0.4"
glob = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
runwatch-core = { path = "crates/runwatch-core" }
runwatch-ssh = { path = "crates/runwatch-ssh" }
runwatch-engine = { path = "crates/runwatch-engine" }
