name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64 / test + package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Windows native build prerequisites
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          $nasmDir = Join-Path $env:ProgramFiles 'NASM'
          $nasmExe = Join-Path $nasmDir 'nasm.exe'
          if (-not (Test-Path -LiteralPath $nasmExe)) {
            throw "Chocolatey reported a successful NASM install, but $nasmExe was not found"
          }
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nasmDir;$env:PATH"
          & $nasmExe -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Validate R17 endurance driver
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/acceptance/r17_retry_endurance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host ("$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)") }
            throw "R17 endurance driver has $($errors.Count) PowerShell parse error(s)"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/r17_retry_endurance.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "R17 endurance driver self-test exited $LASTEXITCODE" }
      - name: Render critical GUI fixtures
        shell: pwsh
        run: |
          cargo build -p runwatch-gui
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'runwatch-gui-fixtures'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          Add-Type -AssemblyName System.Drawing
          function Render-Fixture([string]$fixture, [int]$width, [int]$height, [string]$name) {
            $env:RUNWATCH_GUI_FIXTURE = $fixture
            $png = Join-Path $fixtureDir "$name.png"
            $process = Start-Process -FilePath (Resolve-Path '.\target\debug\runwatch-gui.exe') -ArgumentList @('--screenshot', $png, '--size', [string]$width, [string]$height, '--renderer', 'software') -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "GUI fixture $fixture at ${width}x${height} exited $($process.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $png)) {
              throw "GUI fixture $fixture at ${width}x${height} did not produce a screenshot"
            }
            $image = [System.Drawing.Image]::FromFile($png)
            try {
              if ($image.Width -ne $width -or $image.Height -ne $height) {
                throw "GUI fixture $fixture rendered $($image.Width)x$($image.Height), expected ${width}x${height}"
              }
            } finally {
              $image.Dispose()
            }
          }
          foreach ($fixture in @('dashboard', 'detail', 'offline', 'new-run', 'retry', 'hosts', 'settings')) {
            Render-Fixture $fixture 1080 720 $fixture
          }
          # A successful PNG alone is not enough for the tall scheduler form: the
          # R16 release gate requires the pinned primary Start Run action to be
          # visibly inside the default viewport. WindUI's primary surface uses
          # the app accent RGB 76/139/245; count it only in the lower-right
          # footer region so the Local Process runner button cannot satisfy it.
          $newRunPng = Join-Path $fixtureDir 'new-run.png'
          $newRunImage = [System.Drawing.Bitmap]::FromFile($newRunPng)
          try {
            $footerAccentPixels = 0
            for ($y = 540; $y -lt [Math]::Min(710, $newRunImage.Height); $y++) {
              for ($x = 600; $x -lt [Math]::Min(900, $newRunImage.Width); $x++) {
                $pixel = $newRunImage.GetPixel($x, $y)
                if ($pixel.R -eq 76 -and $pixel.G -eq 139 -and $pixel.B -eq 245) {
                  $footerAccentPixels++
                }
              }
            }
            if ($footerAccentPixels -lt 100) {
              throw "New Run primary footer action is clipped at 1080x720 ($footerAccentPixels accent pixels)"
            }
          } finally {
            $newRunImage.Dispose()
          }
          # Retry review has its own pinned primary action. Require the action to remain
          # visibly inside the default viewport, not merely present in the element tree.
          $retryPng = Join-Path $fixtureDir 'retry.png'
          $retryImage = [System.Drawing.Bitmap]::FromFile($retryPng)
          try {
            $retryAccentPixels = 0
            for ($y = 540; $y -lt [Math]::Min(710, $retryImage.Height); $y++) {
              for ($x = 600; $x -lt [Math]::Min(980, $retryImage.Width); $x++) {
                $pixel = $retryImage.GetPixel($x, $y)
                if ($pixel.R -eq 76 -and $pixel.G -eq 139 -and $pixel.B -eq 245) {
                  $retryAccentPixels++
                }
              }
            }
            if ($retryAccentPixels -lt 100) {
              throw "Retry Run primary footer action is clipped at 1080x720 ($retryAccentPixels accent pixels)"
            }
          } finally {
            $retryImage.Dispose()
          }
          Render-Fixture 'hosts' 760 720 'hosts-narrow'
          Render-Fixture 'hosts' 1440 900 'hosts-wide'
          Remove-Item Env:RUNWATCH_GUI_FIXTURE -ErrorAction SilentlyContinue
      - name: Build portable Windows package
        run: cargo run -p xtask -- package --output-dir dist/ci-windows
      - name: Verify portable Windows package
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/ci-windows/runwatch-v*-windows-x86_64.zip | Select-Object -First 1
          if (-not $archive) { throw "Windows release archive was not produced" }
          cargo run -p xtask -- verify $archive.FullName
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: runwatch-windows-x86_64-${{ github.sha }}
          path: dist/ci-windows/runwatch-v*-windows-x86_64.zip
          if-no-files-found: error

  linux-glibc217:
    name: Linux x86_64 / glibc 2.17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and test inside the glibc 2.17 baseline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -euxo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              export RUSTUP_HOME=/opt/rustup
              export CARGO_HOME=/opt/cargo
              export CARGO_TARGET_DIR=/work/target-manylinux2014
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              . "$CARGO_HOME/env"
              rustc --version --verbose
              cargo check --workspace --all-targets --exclude runwatch-gui
              cargo test --workspace --all-targets --exclude runwatch-gui
              cargo build --release -p runwatch-cli -p runwatch-mcp
              bash scripts/ci/check-glibc-floor.sh \
                2.17 \
                target-manylinux2014/release/runwatch \
                target-manylinux2014/release/runwatch-mcp
            '
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: runwatch-linux-x86_64-glibc217-${{ github.sha }}
          path: |
            target-manylinux2014/release/runwatch
            target-manylinux2014/release/runwatch-mcp
          if-no-files-found: error
