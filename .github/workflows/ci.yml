name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64 / test + package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Windows native build prerequisites
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          nasm -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Build portable Windows package
        run: cargo run -p xtask -- package --output-dir dist/ci-windows
      - name: Verify portable Windows package
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/ci-windows/runwatch-v*-windows-x86_64.zip | Select-Object -First 1
          if (-not $archive) { throw "Windows release archive was not produced" }
          cargo run -p xtask -- verify $archive.FullName
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: runwatch-windows-x86_64-${{ github.sha }}
          path: dist/ci-windows/runwatch-v*-windows-x86_64.zip
          if-no-files-found: error

  linux-glibc217:
    name: Linux x86_64 / glibc 2.17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and test inside the glibc 2.17 baseline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -euxo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              export RUSTUP_HOME=/opt/rustup
              export CARGO_HOME=/opt/cargo
              export CARGO_TARGET_DIR=/work/target-manylinux2014
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              . "$CARGO_HOME/env"
              rustc --version --verbose
              cargo check --workspace --all-targets --exclude runwatch-gui
              cargo test --workspace --all-targets --exclude runwatch-gui
              cargo build --release -p runwatch-cli -p runwatch-mcp
              bash scripts/ci/check-glibc-floor.sh \
                2.17 \
                target-manylinux2014/release/runwatch \
                target-manylinux2014/release/runwatch-mcp
            '
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: runwatch-linux-x86_64-glibc217-${{ github.sha }}
          path: |
            target-manylinux2014/release/runwatch
            target-manylinux2014/release/runwatch-mcp
          if-no-files-found: error
